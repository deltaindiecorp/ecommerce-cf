name            = "ecommerce-api"
main            = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ─── D1 Database ──────────────────────────────────────────────────────────────
[[d1_databases]]
binding      = "DB"
database_name = "ecommerce-db"
database_id  = "YOUR_D1_DATABASE_ID"
# Schema-nya hidup di packages/db, bukan di sini. Tanpa baris ini
# `wrangler d1 migrations` mencari ./migrations relatif ke berkas ini dan tidak
# menemukan apa pun. Lihat scripts/db-migrate.mjs.
migrations_dir = "../../packages/db/migrations"

# ─── KV Namespaces ────────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "CART_KV"
id      = "YOUR_CART_KV_ID"

[[kv_namespaces]]
binding = "SESSION_KV"
id      = "YOUR_SESSION_KV_ID"

[[kv_namespaces]]
binding = "CACHE_KV"
id      = "YOUR_CACHE_KV_ID"

# ─── R2 Buckets ───────────────────────────────────────────────────────────────
[[r2_buckets]]
binding     = "STORAGE"
bucket_name = "ecommerce-storage"

# ─── Queues ───────────────────────────────────────────────────────────────────
[[queues.producers]]
binding    = "NOTIFICATION_QUEUE"
queue      = "notification-queue"

[[queues.producers]]
binding    = "RESI_POLL_QUEUE"
queue      = "resi-poll-queue"

[[queues.consumers]]
queue          = "notification-queue"
max_batch_size = 10
max_retries    = 3

[[queues.consumers]]
queue          = "resi-poll-queue"
max_batch_size = 20
max_retries    = 2

# ─── Durable Objects ──────────────────────────────────────────────────────────
[[durable_objects.bindings]]
name        = "CART_DO"
class_name  = "CartDurableObject"

[[durable_objects.bindings]]
name        = "STOCK_LOCK_DO"
class_name  = "StockLockDurableObject"

[[migrations]]
tag = "v1"
new_classes = ["CartDurableObject", "StockLockDurableObject"]

# ─── Cron Triggers ────────────────────────────────────────────────────────────
[triggers]
crons = [
  "*/30 * * * *",   # Poll resi setiap 30 menit
  "0 * * * *",      # Expire pending payments tiap jam
  "0 0 * * *",      # Daily cleanup guest sessions
]

# ─── Environment Variables ────────────────────────────────────────────────────
# HANYA konfigurasi non-rahasia yang boleh ada di sini.
#
# JANGAN pernah menambahkan JWT_SECRET, kunci gateway pembayaran, atau API key
# apa pun ke blok [vars] — nilai di sini MENANG atas secret bernama sama dan
# menimpanya setiap kali `wrangler deploy` jalan. Sebelumnya kesembilan secret
# tercantum di sini dengan nilai "", sehingga mengikuti langkah
# `wrangler secret put` di scripts/setup.sh justru menghasilkan deployment yang
# semua secretnya kosong: JWT_SECRET kosong membuat crypto.subtle.importKey
# melempar DataError, dan seluruh login serta requireAdmin mati serentak.
#
# Semua rahasia diset lewat: cd apps/api && npx wrangler secret put <NAMA>
# Daftar lengkapnya ada di scripts/setup.sh dan apps/api/.dev.vars.example.
# Untuk dev lokal, wrangler membacanya dari apps/api/.dev.vars (gitignored).
[vars]
ENVIRONMENT          = "production"
APP_URL              = "https://your-store.com"
CORS_ORIGINS         = "https://your-store.com,http://localhost:3000,http://localhost:3001"
EMAIL_FROM_NAME      = "Deltacommerce"
EMAIL_FROM_ADDRESS   = "noreply@your-store.com"
MIDTRANS_IS_PROD     = "true"   # "false" untuk sandbox Midtrans

# ─── Migration Path: Hyperdrive (uncomment jika migrasi ke Neon) ──────────────
# [[hyperdrive]]
# binding    = "HYPERDRIVE"
# id         = "YOUR_HYPERDRIVE_ID"

[dev]
port = 8787
